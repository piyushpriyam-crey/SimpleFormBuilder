{% extends 'builder/base.html' %}
{% block title %}New Form{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 card-title mb-3">Create a Form</h1>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Form name</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Contact Us">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Optional"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Create &amp; Build</button>
          <a href="{% url 'builder:list' %}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
